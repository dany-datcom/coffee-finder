<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find the best coffee shops to study, work, or code with good WiFi and comfort.">
  <title>Code & Coffee Finder ☕</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <!-- Navigation bar component -->
  <nav class="navbar" id="navbar">
    <!-- Dynamically rendered navbar -->
  </nav>

  <!-- Main application container -->
  <main id="app">
    <!-- Page content rendered dynamically based on current route -->
  </main>

  <!-- Modal for displaying coffee shop details -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="modal-body">
        <!-- Modal content loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- Footer component -->
  <footer class="footer" id="footer">
    <!-- Dynamically rendered footer -->
  </footer>

  <!-- Application entry point -->
  <script type="module" src="/src/main.js"></script>

  <!-- Google Maps JavaScript API -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyACnb-PSZ2fE_Cop1HYAizvZoqu82G23qI">
  </script>

</body>

</html>
